<!DOCTYPE html>
<html>
  <head>
    <title>digital counter</title>
    <link rel="stylesheet" href="counter.css">

  </head>
  <body>
    <div class="counter">
      <h1>digital counter</h1>
      <div id="count">0</div>
      <button id="decrease">-</button>
      <button id="increase">+</button>
      <br><br>
      <button id="reset">reset</button>
    </div>
    <script src="counter.js"></script>
  </body>
</html>
