<!DOCTYPE html>
<html>
<head>
  <title>Random User Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      text-align: center;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      display: none;
    }
    .card img {
      border-radius: 50%;
      width: 120px;
    }
    .loading {
      color: orange;
      font-weight: bold;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    .fav-btn.saved {
      background-color: gold;
    }
    #favorites-list {
      text-align: left;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Random User Generator</h1>
  <button id="generate-btn">Generate User</button>

  <div id="status"></div>

  <div class="card" id="user-card">
    <img id="user-photo" src="" alt="User photo">
    <h2 id="user-name"></h2>
    <p id="user-email"></p>
    <p id="user-location"></p>
    <button id="fav-btn" class="fav-btn">⭐ Save to Favorites</button>
  </div>

  <h3>Favorites</h3>
  <ul id="favorites-list"></ul>

  <script src="scrip.js"></script>
</body>
</html>
