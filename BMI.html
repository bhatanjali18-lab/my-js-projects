<!DOCTYPE html>
<html>
  <head>
    <title>
      BMI calculator
      
      
    </title>
    <link rel="stylesheet" href="BMI.css">
  </head>
  <body>
    <div class="container">
      <h1>BMI calculator</h1>
      <input 
      type="number"
      id="weight"
      placeholder="weight(kg)"
      >
      <input 
      type="number"
      id="height"
      placeholder="Height(cm)">
      <button id="calculate">
        Calculate BMI
      </button>
      <h2 id="result"></h2>
      <p id="category"></p>

    </div>
    <script src="BMI.js"></script>
  </body>
</html>
